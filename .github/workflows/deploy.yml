# 운영 서버 배포 (docs/deploy-gcp.md). 두 가지로 돕니다.
#   - main에 머지하면 저절로. 이미지에 들어가는 파일이 바뀐 머지만 배포합니다 (아래 paths, Dockerfile과 맞춥니다).
#     README, docs/, 학습 도구, 테스트만 바뀐 머지는 서버를 다시 켜지 않습니다.
#   - Actions 탭 → Deploy → Run workflow 버튼. 바뀐 파일과 상관없이 main의 마지막 커밋을 올립니다.
# 하는 일은 deploy/deploy.sh와 같습니다. 이미지를 만들어 올리고, VM 메타데이터 bm-image를 바꾸고, VM의 시작 스크립트를 다시 돌립니다.
# 이미지는 Cloud Build 대신 이 러너에서 같은 Dockerfile로 만듭니다.
#
# 서버가 다시 켜지면 진행 중인 대국이 사라지므로, 이미지를 만든 뒤 대국이 없어질 때까지 1분마다 보며 최대 30분 기다립니다.
# 그래도 대국이 있으면 실패로 멈춥니다. 버튼에서 "진행 중인 대국이 있어도 배포"를 체크하면 기다리지 않습니다.
# 기다리는 동안 새 머지가 들어오면 앞의 실행은 취소되고, 최신 커밋 하나만 올립니다.
#
# GCP에는 키 파일 없이 Workload Identity로 들어갑니다. 처음 한 번 deploy/setup-github.sh가 필요하고,
# 그 설정은 main 브랜치에서 돈 워크플로만 받아 줍니다.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - server/**
      - web/**
      - games/**
      - sdk/playground/**
      - sdk/check.js
      - trainer/env.js
      - trainer/mcts.js
      - deploy/startup.sh
      - '!**/*.md'
      - '!**/*_test.go'
      - '!**/*.test.js'
      - '!**/*.test.mjs'
  workflow_dispatch:
    inputs:
      force:
        description: 진행 중인 대국이 있어도 기다리지 않고 배포 (그 대국은 사라집니다)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Workload Identity로 GCP에 들어갈 때 씁니다

# deploy/config.sh와 같은 값입니다
env:
  PROJECT: boardmadang
  REGION: asia-northeast3
  ZONE: asia-northeast3-a
  VM: boardmadang
  REPO: boardmadang
  DOMAIN: boardmadang.com
  WIF_PROVIDER: projects/480625915168/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: boardmadang-deploy@boardmadang.iam.gserviceaccount.com
  DEPLOY_USER: deploy
  DEPLOY_KEY_SECRET: deploy-ssh-key
  # VM의 SSH 호스트 키 (/etc/ssh/ssh_host_ed25519_key.pub). VM을 새로 만들면 바뀌므로, 그때 이 값도 바꿉니다
  HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGKbTpNW1jfynL3Bu5gNFlGY0tVGHNYgbIS+ZQyX26iU

jobs:
  # 이미지는 먼저 만들어 둡니다. 대국이 끝나기를 기다린 뒤에는 바로 올릴 수 있게
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: 이미지 빌드와 올리기
        id: image
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT/$REPO/server:$(git rev-parse --short=12 HEAD)
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >>"$GITHUB_OUTPUT"

  # 새 실행이 오면 기다리던 앞의 실행은 취소됩니다
  wait:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: deploy-wait
      cancel-in-progress: true
    steps:
      - name: 진행 중인 대국이 끝나기를 기다림
        env:
          FORCE: ${{ inputs.force == true }}
        run: |
          if [ "$FORCE" = true ]; then
            echo "진행 중인 대국이 있어도 배포합니다"
            exit 0
          fi
          count() {
            local body
            # 사이트가 응답하지 않으면 지금 둘 수 있는 대국도 없으므로 0으로 봅니다 (고치는 배포가 막히지 않게)
            if ! body=$(curl -sf --max-time 10 --retry 3 --retry-all-errors "https://$DOMAIN$1"); then
              echo "::warning::$1 이 응답하지 않습니다" >&2
              echo 0
              return
            fi
            # 응답을 못 읽으면 대국이 있는지 모르므로 여기서 멈춥니다
            jq length <<<"$body"
          }
          for try in $(seq 0 30); do
            live=$(count /api/live)
            ai=$(count /api/ai/live)
            if [ "$live" = 0 ] && [ "$ai" = 0 ]; then
              echo "진행 중인 대국 없음"
              exit 0
            fi
            echo "진행 중: 대전 $live, AI 대국 $ai ($try분째 기다리는 중)"
            [ "$try" = 30 ] || sleep 60
          done
          echo "::error::30분을 기다려도 대국이 끝나지 않았습니다. 나중에 Run workflow를 다시 누르거나, '진행 중인 대국이 있어도 배포'를 체크하세요."
          exit 1

  # 배포가 두 개 겹치지 않게 합니다. 기다리는 실행은 가장 최근 것 하나만 남습니다
  deploy:
    needs: [build, wait]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: VM에 배포
        run: |
          gcloud compute instances add-metadata "$VM" --project "$PROJECT" --zone "$ZONE" \
            --metadata "bm-image=$IMAGE" --metadata-from-file startup-script=deploy/startup.sh
          ip=$(gcloud compute instances describe "$VM" --project "$PROJECT" --zone "$ZONE" \
            --format 'value(networkInterfaces[0].accessConfigs[0].natIP)')
          install -d -m 700 ~/.ssh
          gcloud secrets versions access latest --secret "$DEPLOY_KEY_SECRET" --project "$PROJECT" --out-file ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "$ip $HOST_KEY" >~/.ssh/known_hosts
          # 컨테이너가 뜬 뒤에도 서버는 저장된 기록과 나라 파일(GEO_FILE)을 읽는 몇 초 동안 응답하지 않으므로, 1분까지 다시 물어봅니다
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$ip" \
            'sudo google_metadata_script_runner startup && curl -sf --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 60 --max-time 5 http://127.0.0.1:8080/healthz && echo " ← 서버 응답"'
          rm -f ~/.ssh/deploy

      - name: 사이트 응답 확인
        run: |
          for try in 1 2 3 4 5 6; do
            if curl -sf --max-time 10 "https://$DOMAIN/healthz" >/dev/null; then
              echo "https://$DOMAIN 응답함"
              echo "배포함: \`$IMAGE\`" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$DOMAIN/healthz 가 응답하지 않습니다"
          exit 1
