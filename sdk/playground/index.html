<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>boardmadang playground</title>
  <link rel="stylesheet" href="playground.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="title">boardmadang playground</h1>
      <p id="meta" class="meta"></p>
    </div>
    <div class="controls">
      <label title="Languages marked full in listing.json">In-game text <select id="lang"></select></label>
      <label>Seed <input id="seed" type="number" min="0" max="4294967295"></label>
      <button id="restart">New game (this seed)</button>
      <button id="newseed">New game (new seed)</button>
      <button id="undo" class="secondary">Undo</button>
      <button id="random" class="secondary">Play 200 random games</button>
    </div>
  </header>

  <div id="fatal" class="fatal" hidden></div>

  <p id="status" class="status"></p>
  <p id="counts" class="counts"></p>

  <main id="boards" class="boards"></main>

  <section class="panels">
    <div class="card">
      <h3>Checks</h3>
      <ul id="checks" class="checks"></ul>
      <div id="random-result"></div>
    </div>
    <div class="card">
      <h3>Thumbnail <small>shown in the game list</small></h3>
      <canvas id="thumb" class="thumb" hidden></canvas>
      <p id="thumb-status" class="thumb-status">None yet. Press "Use as thumbnail" under a board to save that board as it is.</p>
    </div>
    <div class="card">
      <h3>Moves <small>newest first</small></h3>
      <ol id="log" class="log"></ol>
    </div>
    <div class="card">
      <h3>state</h3>
      <pre id="state"></pre>
    </div>
  </section>

  <script type="module" src="playground.js"></script>
</body>
</html>
