<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대전 · 보드마당</title>
  <meta name="description" content="링크를 누르면 친구가 만든 방에 바로 들어갑니다. 설치도 가입도 필요 없습니다.">
  <!-- 링크 미리보기(카톡, 디스코드 등). 미리보기 봇은 스크립트를 돌리지 않아서 HTML에 적고, 그림은 절대 주소로 둡니다 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="보드마당">
  <meta property="og:title" content="보드마당에서 한 판 해요!">
  <meta property="og:description" content="링크를 누르면 친구가 만든 방에 바로 들어갑니다. 설치도 가입도 필요 없습니다.">
  <meta property="og:image" content="https://boardmadang.com/web/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icon-32.png" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="match.css">
</head>
<body class="page">
  <!-- 글자는 web/i18n.js에 언어별로 있습니다. 여기 적힌 한국어는 스크립트가 돌기 전 잠깐 보이는 기본값입니다. -->
  <header class="topbar">
    <a class="logo" href="/web/">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span data-i18n="site.name">보드마당</span>
    </a>
    <nav class="menu" data-i18n-attr="aria-label:menu.label" aria-label="메뉴">
      <a href="/web/" data-i18n="menu.games">게임</a>
      <a href="/web/rooms.html" data-i18n="menu.rooms">방 목록</a>
      <span class="soon" data-i18n="menu.ranking" data-i18n-attr="title:soon" title="준비 중">랭킹</span>
      <a href="/web/register.html" data-i18n="menu.register">게임 등록</a>
    </nav>
    <div class="langs">
      <button class="lang-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="화면 언어: 한국어">KO</button>
    </div>
    <a class="me" href="/web/history.html" hidden></a>
    <button class="logout" type="button" data-i18n="logout" hidden>로그아웃</button>
    <div class="login-box">
      <button class="login" type="button" aria-haspopup="menu" aria-expanded="false" disabled data-i18n="login">로그인</button>
      <div class="login-menu" role="menu" hidden></div>
    </div>
  </header>

  <main class="match match-room">
    <!-- 왼쪽: 게임 이름, 상태, 판과 게임 안내 -->
    <section class="mr-board" data-i18n-attr="aria-label:match.board" aria-label="판">
      <div class="mr-title">
        <a class="mr-back" href="/web/" data-i18n-attr="aria-label:match.toLobby title:match.toLobby" aria-label="게임 목록"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></a>
        <h1 id="title"></h1>
        <p id="timer-info" class="timer-info" hidden></p>
      </div>
      <p id="status" class="match-status" role="status"></p>

      <!-- 방을 만들고 상대를 기다리는 동안 -->
      <div id="hosting" class="hosting" hidden>
        <p><span data-i18n="match.roomCode">방 코드</span> <b id="room-code"></b></p>
        <button id="invite" class="btn" type="button">초대 링크 복사</button>
        <button id="bump" class="btn ghost" type="button" data-i18n="match.bump">목록 맨 위로 올리기</button>
        <small id="bump-wait" class="bump-wait"></small>
        <a href="/web/rooms.html" data-i18n="match.seeRooms">방 목록 보기</a>
      </div>

      <div id="board-wrap" class="board-wrap" hidden>
        <canvas id="board"></canvas>
      </div>
      <p id="message" class="message"></p>
    </section>

    <!-- 오른쪽: 상대(위), 대화와 수순, 버튼, 나(아래). 판에서 내 쪽이 아래라서 같은 방향입니다.
         휴대폰에서는 상대 · 판 · 나 · 대화 · 버튼 순서로 한 줄에 놓입니다 (match.css의 order) -->
    <aside class="mr-side" data-i18n-attr="aria-label:match.side" aria-label="대국 정보">
      <div id="players" class="players" hidden>
        <section class="who opp">
          <span class="emote-bubble" id="opp-emote" role="status" hidden></span>
          <span class="avatar" aria-hidden="true"><i class="dot" id="opp-dot"></i></span>
          <span class="who-name"><b id="opp-name"></b><small id="opp-seat"></small></span>
          <time id="opp-clock" class="clock" hidden></time>
          <span class="clock-bar" aria-hidden="true"><i id="opp-bar"></i></span>
        </section>
        <section class="who mine">
          <span class="emote-bubble" id="my-emote" role="status" hidden></span>
          <span class="avatar" aria-hidden="true"><i class="dot" id="my-dot"></i></span>
          <span class="who-name"><b id="my-name"></b><small id="my-seat"></small></span>
          <span id="my-turn" class="turn-chip" data-i18n="match.turnChip" hidden>내 차례</span>
          <time id="my-clock" class="clock" hidden></time>
          <span class="clock-bar" aria-hidden="true"><i id="my-bar"></i></span>
        </section>
      </div>

      <!-- 대화(주고받은 이모티콘)와 수순. 이모티콘은 정해진 그림만 보냅니다 (emotes.js). 채팅은 없습니다 -->
      <section id="log-box" class="log-box" data-i18n-attr="aria-label:match.log" aria-label="대화와 수순" hidden>
        <div class="log-head">
          <div class="log-tabs" role="group" data-i18n-attr="aria-label:match.log" aria-label="대화와 수순">
            <button type="button" data-log="talk" aria-pressed="true" data-i18n="match.log.talk">대화</button>
            <button type="button" data-log="moves" aria-pressed="false" data-i18n="match.log.moves">수순</button>
          </div>
          <button id="emote-mute" class="icon-btn" type="button">
            <svg class="on" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 6a3 3 0 0 1 0 4M12.5 4.5a5 5 0 0 1 0 7"/></svg>
            <svg class="off" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M11 6l3 4M14 6l-3 4"/></svg>
          </button>
        </div>
        <ol id="talk-log" class="log-list"></ol>
        <ol id="moves-log" class="moves-list" hidden></ol>
        <div id="emote-bar" class="emote-bar" hidden>
          <div id="emote-buttons" class="emote-buttons" role="group" data-i18n-attr="aria-label:emote.label" aria-label="이모티콘"></div>
        </div>
      </section>

      <!-- 무승부 제안: 내가 했으면 철회, 상대가 했으면 수락 / 거절 -->
      <div id="draw-offer" class="offer" hidden>
        <span id="draw-text"></span>
        <button id="draw-accept" class="btn" type="button" data-i18n="match.draw.accept">수락</button>
        <button id="draw-decline" class="btn ghost" type="button" data-i18n="match.draw.decline">거절</button>
        <button id="draw-withdraw" class="btn ghost" type="button" data-i18n="match.draw.withdraw">철회</button>
      </div>

      <div class="match-actions">
        <span id="specials" class="specials"></span>
        <button id="draw" class="btn ghost" type="button" data-i18n="match.draw.offer" hidden>무승부 제안</button>
        <button id="resign" class="btn ghost danger" type="button" data-i18n="match.resign" hidden>기권</button>
        <button id="cancel" class="btn ghost" type="button" data-i18n="match.cancel" hidden>취소</button>
        <button id="rematch" class="btn" type="button" hidden></button>
        <button id="again" class="btn" type="button" data-i18n="match.again" hidden>다시 찾기</button>
        <a id="replay" class="btn ghost" data-i18n="match.replay" hidden>기보 보기</a>
        <a id="to-lobby" class="btn ghost" href="/web/" data-i18n="match.toLobby">게임 목록</a>
      </div>
      <p id="rematch-note" class="match-note" hidden></p>
      <p id="note" class="match-note" hidden></p>
    </aside>
  </main>

  <script type="module" src="match.js"></script>
</body>
</html>
