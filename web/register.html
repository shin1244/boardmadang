<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게임 등록 · 보드마당</title>
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="register.css">
</head>
<body class="page">
  <!-- 글자는 web/i18n.js에 언어별로 있습니다. 여기 적힌 한국어는 스크립트가 돌기 전 잠깐 보이는 기본값입니다. -->
  <header class="topbar">
    <a class="logo" href="/web/">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span data-i18n="site.name">보드마당</span>
    </a>
    <nav class="menu" data-i18n-attr="aria-label:menu.label" aria-label="메뉴">
      <a href="/web/" data-i18n="menu.games">게임</a>
      <a href="/web/rooms.html" data-i18n="menu.rooms">방 목록</a>
      <span class="soon" data-i18n="menu.ranking" data-i18n-attr="title:soon" title="준비 중">랭킹</span>
      <a href="/web/register.html" aria-current="page" data-i18n="menu.register">게임 등록</a>
    </nav>
    <div class="langs" role="group" data-i18n-attr="aria-label:lang.label" aria-label="화면 언어">
      <button type="button" data-lang="ko" lang="ko">KR</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
    <a class="me" href="/web/history.html" hidden></a>
    <button class="logout" type="button" data-i18n="logout" hidden>로그아웃</button>
    <div class="login-box">
      <button class="login" type="button" aria-haspopup="menu" aria-expanded="false" disabled data-i18n="login">로그인</button>
      <div class="login-menu" role="menu" hidden></div>
    </div>
  </header>

  <main class="register">
    <h1 data-i18n="register.title">게임 등록</h1>
    <p class="lead" data-i18n="register.lead"></p>

    <!-- 게스트는 업로드할 수 없습니다. 계정이 아니면 이 안내만 보이고 폼은 숨깁니다. -->
    <section id="need-account" class="block need-account" hidden>
      <h2 class="block-title" data-i18n="register.needAccount.title">게임 업로드는 계정이 필요합니다</h2>
      <p data-i18n="register.needAccount.body"></p>
      <a class="btn ghost" href="/web/" data-i18n="register.needAccount.back">게임 목록으로</a>
    </section>

    <div id="member-only">
    <ol class="steps">
      <!-- 번호는 register.js가 보이는 단계 순서대로 씁니다. 직접 깨기는 사이트에서만 합니다 -->
      <li data-step="1"><b>1</b> <span data-i18n="register.step0">게임 파일</span></li>
      <li data-step="2"><b>2</b> <span data-i18n="register.stepClear">직접 깨기</span></li>
      <li data-step="3"><b>3</b> <span data-i18n="register.step1">게임과 언어</span></li>
      <li data-step="4"><b>4</b> <span data-i18n="register.step2">설명 글</span></li>
    </ol>

    <div id="problems" class="problems" role="alert" hidden>
      <b data-i18n="register.problems"></b>
      <ul></ul>
    </div>

    <form id="form" novalidate>
      <!-- 1단계: 게임 코드. 사이트에서는 zip을 올려 자동 검사하고, 개발 서버에서는 games/의 게임을 고릅니다 (register.js의 mode) -->
      <div class="step" id="step-1">
        <!-- 사이트: 내 게임의 등록 정보만 고칠 때 (내 프로필에서 ?edit=<id>로 열림). 코드를 바꾸려면 아래에 zip을 새로 올립니다 -->
        <section class="block" id="editing" hidden>
          <h2 class="block-title" data-i18n="register.editing">고칠 게임</h2>
          <p id="editing-name" class="editing-name"></p>
          <p id="editing-hint" class="hint" data-i18n="register.editing.hint"></p>
          <p id="editing-status" class="status-line bad" role="status"></p>
          <a class="btn ghost" href="/web/history.html" data-i18n="register.toProfile">내 프로필에서 보기</a>
        </section>

        <section class="block" id="upload" hidden>
          <label class="block-title" for="zip" data-i18n="register.zip">게임 파일 (zip)</label>
          <input id="zip" type="file" accept=".zip,application/zip">
          <p class="hint" data-i18n="register.zip.hint"></p>
          <p id="upload-status" class="status-line" role="status"></p>
        </section>

        <!-- 올린 zip의 자동 검사 결과. 문제 글은 검사 코드(sdk/check.js)가 쓴 영어 그대로입니다 -->
        <section class="block" id="check" hidden>
          <h2 class="block-title" data-i18n="register.check">자동 검사</h2>
          <dl id="facts" class="facts"></dl>
          <p id="check-status" class="status-line"></p>
          <ul id="check-problems" class="check-list bad"></ul>
          <p id="check-stats" class="hint"></p>
          <div id="check-warnings" class="check-notes" hidden>
            <b data-i18n="register.check.warnings">참고</b>
            <ul class="check-list"></ul>
          </div>
        </section>

        <section class="block" id="pick" hidden>
          <label class="block-title" for="game" data-i18n="register.game">게임</label>
          <select id="game"></select>
          <p class="hint" data-i18n="register.game.hint"></p>
          <p id="game-status" class="status-line"></p>
        </section>

        <div class="form-actions">
          <button id="next-1" class="btn" type="button" data-i18n="register.next" disabled>다음</button>
        </div>
      </div>

      <!-- 2단계 (사이트만): 직접 깨기. 혼자 양쪽을 둬서 이겨야(result()가 승자를 정해야) 등록할 수 있습니다.
           이긴 판은 제작자 클리어 기보로 남습니다. 같은 판에서 로비 썸네일도 찍습니다 -->
      <div class="step" id="step-2" hidden>
        <section class="block" id="clear">
          <h2 class="block-title" data-i18n="register.clear">직접 깨기</h2>
          <p class="hint" data-i18n="register.clear.lead"></p>
          <div class="play">
            <div class="play-board">
              <canvas id="play-board"></canvas>
              <p id="play-message" class="play-message"></p>
            </div>
            <div class="play-side">
              <p id="play-status" class="play-status" role="status"></p>
              <div class="seats" role="group" data-i18n-attr="aria-label:register.play.seat">
                <span class="seats-label" data-i18n="register.play.seat">두는 쪽</span>
                <button type="button" class="chip seat" data-seat="0"><i class="dot"></i> <span data-i18n="match.first">선공</span></button>
                <button type="button" class="chip seat" data-seat="1"><i class="dot"></i> <span data-i18n="match.second">후공</span></button>
              </div>
              <div id="play-specials" class="play-buttons"></div>
              <div class="play-buttons">
                <button id="play-undo" class="btn ghost" type="button" data-i18n="register.play.undo">한 수 무르기</button>
                <button id="play-restart" class="btn ghost" type="button" data-i18n="register.play.restart">처음부터</button>
              </div>
              <p id="play-note" class="hint"></p>
              <p id="clear-status" class="status-line"></p>
            </div>
          </div>
        </section>

        <section class="block" id="thumb">
          <h2 class="block-title" data-i18n="register.thumb">썸네일</h2>
          <p class="hint" data-i18n="register.thumb.lead"></p>
          <div class="thumb-row">
            <canvas id="thumb-board"></canvas>
            <div>
              <p id="thumb-status" class="status-line"></p>
              <div class="play-buttons">
                <button id="thumb-shot" class="btn ghost" type="button" data-i18n="register.thumb.shot">지금 판을 썸네일로</button>
                <button id="thumb-drop" class="btn ghost" type="button" data-i18n="register.thumb.drop">썸네일 빼기</button>
              </div>
            </div>
          </div>
        </section>

        <div class="form-actions">
          <button id="back-2" class="btn ghost" type="button" data-i18n="register.back">이전</button>
          <button id="next-2" class="btn" type="button" data-i18n="register.next" disabled>다음</button>
        </div>
      </div>

      <!-- 3단계: 난이도, 타이머, 지원 언어 -->
      <div class="step" id="step-3" hidden>

        <fieldset class="block" id="difficulty">
          <legend class="block-title" data-i18n="register.difficulty">난이도</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="difficulty" value="easy"><span><b data-i18n="difficulty.easy">하</b><small data-i18n="difficulty.easy.hint"></small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="normal"><span><b data-i18n="difficulty.normal">중</b><small data-i18n="difficulty.normal.hint"></small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="hard"><span><b data-i18n="difficulty.hard">상</b><small data-i18n="difficulty.hard.hint"></small></span></label>
          </div>
        </fieldset>

        <!-- 타이머를 쓰려면 게임 코드에 turn()이 있어야 합니다. 없으면 register.js가 이 칸을 막습니다. -->
        <fieldset class="block" id="timer">
          <legend class="block-title" data-i18n="register.timer">타이머</legend>
          <p class="hint" data-i18n="register.timer.lead"></p>
          <div class="timer-row">
            <label class="pick"><input type="radio" name="timer" value="none"> <span data-i18n="timer.none">타이머 없음</span></label>
            <label class="pick"><input type="radio" name="timer" value="on"> <span data-i18n="register.timer.each">각자</span>
              <input id="timer-minutes" type="number" min="1" max="180" step="1" inputmode="numeric">
              <span data-i18n="timer.minutesUnit">분</span></label>
          </div>
          <label class="pick"><input id="timer-custom" type="checkbox"> <span data-i18n="register.timer.custom">방장이 시간을 정할 수 있음</span></label>
          <p class="hint" data-i18n="register.timer.custom.hint"></p>
          <p id="timer-status" class="status-line"></p>
        </fieldset>

        <section class="block" id="langs">
          <h2 class="block-title" data-i18n="register.langs">지원 언어</h2>
          <p class="hint" data-i18n="register.langs.lead"></p>

          <!-- 언어 버튼은 register.js가 LANGS 순서대로 채웁니다. 한 언어는 둘 중 한 곳에만 들어갑니다. -->
          <div class="lang-group">
            <h3><span data-i18n="support.rulebook">일부 번역</span> <small data-i18n="support.rulebook.short"></small></h3>
            <p class="hint" data-i18n="support.rulebook.hint"></p>
            <div class="chips" data-level="rulebook" role="group" data-i18n-attr="aria-label:support.rulebook"></div>
          </div>
          <div class="lang-group">
            <h3><span data-i18n="support.full">완전 번역</span> <small data-i18n="support.full.short"></small></h3>
            <p class="hint" data-i18n="support.full.hint"></p>
            <div class="chips" data-level="full" role="group" data-i18n-attr="aria-label:support.full"></div>
          </div>

          <aside class="note">
            <b data-i18n="register.code.title"></b>
            <p data-i18n="register.code.body"></p>
          </aside>
        </section>

        <div class="form-actions">
          <button id="back-3" class="btn ghost" type="button" data-i18n="register.back">이전</button>
          <button id="next-3" class="btn" type="button" data-i18n="register.next">다음</button>
        </div>
      </div>

      <!-- 4단계: 고른 언어마다 이름, 소개, 룰북 -->
      <div class="step" id="step-4" hidden>
        <section class="block">
          <h2 class="block-title" data-i18n="register.texts">설명 글</h2>
          <p class="hint" data-i18n="register.texts.lead"></p>
          <div id="texts"></div>
        </section>

        <div class="form-actions">
          <button id="back-4" class="btn ghost" type="button" data-i18n="register.back">이전</button>
          <!-- 글자는 register.js가 고릅니다: 사이트면 등록, 개발 서버면 저장 -->
          <button id="save" class="btn" type="submit">저장</button>
          <span id="save-status" class="status-line" role="status"></span>
        </div>
      </div>
    </form>
    </div>
  </main>

  <template id="text-block">
    <fieldset class="text-block">
      <legend><span class="lang-name"></span> <small class="level-tag"></small></legend>
      <div class="fields">
        <label><span data-i18n="field.name"></span> <small class="counter"></small>
          <input data-field="name" type="text">
        </label>
        <label><span data-i18n="field.description"></span> <small class="counter"></small>
          <textarea data-field="description" rows="2"></textarea>
        </label>
        <label><span data-i18n="field.rulebook"></span> <small class="counter"></small>
          <textarea data-field="rulebook" rows="10"></textarea>
          <small class="hint" data-i18n="field.rulebook.hint"></small>
        </label>
      </div>
    </fieldset>
  </template>

  <script type="module" src="register.js"></script>
</body>
</html>
