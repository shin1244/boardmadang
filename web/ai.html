<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI와 두기 · 보드마당</title>
  <meta name="description" content="학습한 AI와 혼자 둡니다. 서버 없이 브라우저 안에서 돕니다.">
  <!-- 링크 미리보기(카톡, 디스코드 등). 미리보기 봇은 스크립트를 돌리지 않아서 HTML에 적고, 그림은 절대 주소로 둡니다 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="보드마당">
  <meta property="og:title" content="보드마당 · AI와 두기">
  <meta property="og:description" content="학습한 AI와 혼자 둡니다. 서버 없이 브라우저 안에서 돕니다.">
  <meta property="og:image" content="https://boardmadang.com/web/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icon-32.png" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="match.css">
</head>
<body class="page">
  <!-- 글자는 web/i18n.js에 언어별로 있습니다. 여기 적힌 한국어는 스크립트가 돌기 전 잠깐 보이는 기본값입니다. -->
  <header class="topbar">
    <a class="logo" href="/web/">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span data-i18n="site.name">보드마당</span>
    </a>
    <nav class="menu" data-i18n-attr="aria-label:menu.label" aria-label="메뉴">
      <a href="/web/" data-i18n="menu.games">게임</a>
      <a href="/web/rooms.html" data-i18n="menu.rooms">방 목록</a>
      <span class="soon" data-i18n="menu.ranking" data-i18n-attr="title:soon" title="준비 중">랭킹</span>
      <a href="/web/register.html" data-i18n="menu.register">게임 등록</a>
    </nav>
    <div class="langs">
      <button class="lang-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="화면 언어: 한국어">KO</button>
    </div>
    <a class="me" href="/web/history.html" hidden></a>
    <button class="logout" type="button" data-i18n="logout" hidden>로그아웃</button>
    <div class="login-box">
      <button class="login" type="button" aria-haspopup="menu" aria-expanded="false" disabled data-i18n="login">로그인</button>
      <div class="login-menu" role="menu" hidden></div>
    </div>
  </header>

  <main class="match ai-match">
    <h1 id="title"></h1>
    <p class="timer-info" data-i18n="ai.note">AI와 둔 판은 기보와 랭킹에 남지 않습니다.</p>

    <div id="players" class="players" hidden>
      <span class="who"><i class="dot" id="my-dot"></i><b id="my-name"></b> <small id="my-seat"></small></span>
      <span class="vs" aria-hidden="true">vs</span>
      <span class="who"><i class="dot" id="ai-dot"></i><b data-i18n="ai.name">AI</b> <small id="ai-seat"></small></span>
    </div>

    <p id="status" class="match-status" role="status"></p>

    <!-- 어느 쪽으로 둘지 고릅니다 -->
    <div id="choose" class="match-actions" hidden>
      <button id="as-0" class="btn" type="button" data-i18n="ai.asFirst">선공으로 두기</button>
      <button id="as-1" class="btn" type="button" data-i18n="ai.asSecond">후공으로 두기</button>
    </div>

    <div id="board-wrap" class="board-wrap" hidden>
      <canvas id="board"></canvas>
      <p id="message" class="message"></p>
    </div>

    <div class="match-actions">
      <span id="specials" class="specials"></span>
      <button id="resign" class="btn ghost" type="button" data-i18n="match.resign" hidden>기권</button>
      <button id="again" class="btn" type="button" data-i18n="ai.again" hidden>새 판</button>
      <a id="to-lobby" class="btn ghost" href="/web/" data-i18n="match.toLobby">게임 목록</a>
    </div>
  </main>

  <script type="module" src="ai.js"></script>
</body>
</html>
