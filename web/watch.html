<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관전 · 보드마당</title>
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="match.css">
  <link rel="stylesheet" href="replay.css">
</head>
<body class="page">
  <!-- 글자는 web/i18n.js에 언어별로 있습니다. 여기 적힌 한국어는 스크립트가 돌기 전 잠깐 보이는 기본값입니다. -->
  <header class="topbar">
    <a class="logo" href="/web/">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span data-i18n="site.name">보드마당</span>
    </a>
    <nav class="menu" data-i18n-attr="aria-label:menu.label" aria-label="메뉴">
      <a href="/web/" data-i18n="menu.games">게임</a>
      <a href="/web/rooms.html" aria-current="page" data-i18n="menu.rooms">방 목록</a>
      <span class="soon" data-i18n="menu.ranking" data-i18n-attr="title:soon" title="준비 중">랭킹</span>
      <a href="/web/register.html" data-i18n="menu.register">게임 등록</a>
      <a href="/sdk/playground/" data-i18n="menu.playground">플레이그라운드</a>
    </nav>
    <div class="langs" role="group" data-i18n-attr="aria-label:lang.label" aria-label="화면 언어">
      <button type="button" data-lang="ko" lang="ko">KR</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
    <a class="me" href="/web/history.html" hidden></a>
    <button class="login" type="button" disabled data-i18n="login" data-i18n-attr="title:soon" title="준비 중">로그인</button>
  </header>

  <main class="match watch">
    <h1 id="title"></h1>
    <p id="timer-info" class="timer-info" hidden></p>

    <!-- 선공 vs 후공. 관전자는 어느 쪽도 아닙니다 -->
    <div id="players" class="players" hidden>
      <span class="who"><i class="dot" id="p0-dot"></i><b id="p0-name"></b> <small id="p0-tag"></small> <time id="p0-clock" class="clock" hidden></time></span>
      <span class="vs" aria-hidden="true">vs</span>
      <span class="who"><i class="dot" id="p1-dot"></i><b id="p1-name"></b> <small id="p1-tag"></small> <time id="p1-clock" class="clock" hidden></time></span>
    </div>

    <p id="status" class="match-status" role="status"></p>
    <p id="version-note" class="version-note" hidden data-i18n="watch.versionChanged"></p>

    <div id="board-wrap" class="board-wrap" hidden>
      <canvas id="board"></canvas>
      <p id="message" class="message"></p>
    </div>

    <div id="controls" class="replay-controls" hidden>
      <div class="replay-meta">
        <span id="position"></span>
        <label><span data-i18n="replay.viewAs">시점</span>
          <select id="view-as">
            <option value="0" data-i18n="replay.as.0">선공 시점</option>
            <option value="1" data-i18n="replay.as.1">후공 시점</option>
          </select>
        </label>
      </div>
    </div>

    <div class="match-actions">
      <a id="replay" class="btn" data-i18n="match.replay" hidden>기보 보기</a>
      <a class="btn ghost" href="/web/rooms.html" data-i18n="match.toRooms">방 목록으로</a>
    </div>
  </main>

  <script type="module" src="watch.js"></script>
</body>
</html>
