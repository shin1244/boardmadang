<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이름 정하기 · 보드마당</title>
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="signup.css">
</head>
<body class="page signup-page">
  <!-- 처음 로그인한 사람이 이름을 정하는 화면입니다 (docs/identity.md). 이름을 정해야 계정이 만들어집니다. -->
  <header class="topbar">
    <a class="logo" href="/web/">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span data-i18n="site.name">보드마당</span>
    </a>
    <nav class="menu" data-i18n-attr="aria-label:menu.label" aria-label="메뉴">
      <a href="/web/" data-i18n="menu.games">게임</a>
      <a href="/web/rooms.html" data-i18n="menu.rooms">방 목록</a>
      <span class="soon" data-i18n="menu.ranking" data-i18n-attr="title:soon" title="준비 중">랭킹</span>
      <a href="/web/register.html" data-i18n="menu.register">게임 등록</a>
    </nav>
    <div class="langs" role="group" data-i18n-attr="aria-label:lang.label" aria-label="화면 언어">
      <button type="button" data-lang="ko" lang="ko">KR</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
    <a class="me" href="/web/history.html" hidden></a>
    <button class="logout" type="button" data-i18n="logout" hidden>로그아웃</button>
    <div class="login-box">
      <button class="login" type="button" aria-haspopup="menu" aria-expanded="false" disabled data-i18n="login">로그인</button>
      <div class="login-menu" role="menu" hidden></div>
    </div>
  </header>

  <main class="signup">
    <form id="form" class="signup-card" hidden>
      <h1 data-i18n="signup.title">이름 정하기</h1>
      <p id="lead" class="signup-lead"></p>
      <label class="signup-field">
        <span data-i18n="signup.label">이름</span>
        <input id="name" type="text" autocomplete="nickname" autocapitalize="off" spellcheck="false" maxlength="12" required>
      </label>
      <p id="rules" class="signup-rules"></p>
      <p id="error" class="signup-error" role="alert" hidden></p>
      <button id="submit" class="btn" type="submit" data-i18n="signup.submit">시작하기</button>
    </form>
    <div id="expired" class="signup-card" hidden>
      <h1 data-i18n="signup.title">이름 정하기</h1>
      <p data-i18n="signup.expired">로그인 시간이 지났습니다. 다시 로그인해 주세요.</p>
      <a class="btn" href="/web/" data-i18n="signup.toLobby">게임 목록으로</a>
    </div>
  </main>

  <script type="module" src="signup.js"></script>
</body>
</html>
