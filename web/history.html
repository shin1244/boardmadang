<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 프로필 · 보드마당</title>
  <link rel="icon" href="icon-32.png" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="rooms.css">
</head>
<body class="page">
  <!-- 글자는 web/i18n.js에 언어별로 있습니다. 여기 적힌 한국어는 스크립트가 돌기 전 잠깐 보이는 기본값입니다. -->
  <header class="topbar">
    <a class="logo" href="/web/">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span data-i18n="site.name">보드마당</span>
    </a>
    <nav class="menu" data-i18n-attr="aria-label:menu.label" aria-label="메뉴">
      <a href="/web/" data-i18n="menu.games">게임</a>
      <a href="/web/rooms.html" data-i18n="menu.rooms">방 목록</a>
      <span class="soon" data-i18n="menu.ranking" data-i18n-attr="title:soon" title="준비 중">랭킹</span>
      <a href="/web/register.html" data-i18n="menu.register">게임 등록</a>
    </nav>
    <div class="langs">
      <button class="lang-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="화면 언어: 한국어">KO</button>
    </div>
    <a class="me" href="/web/history.html" aria-current="page" hidden></a>
    <button class="logout" type="button" data-i18n="logout" hidden>로그아웃</button>
    <div class="login-box">
      <button class="login" type="button" aria-haspopup="menu" aria-expanded="false" disabled data-i18n="login">로그인</button>
      <div class="login-menu" role="menu" hidden></div>
    </div>
  </header>

  <!-- 내 프로필: 내가 올린 게임(계정만), 내 대국, 계정(계정만). 방 목록과 같은 줄 모양을 씁니다 (rooms.css) -->
  <main class="rooms">
    <h1 id="who" class="profile-name"></h1>
    <p id="suspended-note" class="suspended-note profile-note" role="note" hidden></p>

    <!-- 등록 정보 고치기는 게임 등록 화면(?edit=<id>)에서, 내리기와 다시 올리기는 여기서 바로 합니다 -->
    <section id="mine" class="profile-block" hidden>
      <div class="list-head">
        <h2><span data-i18n="mine.title">내가 올린 게임</span> <span id="mine-count" class="count"></span></h2>
        <div class="rooms-tools"><a class="btn ghost" href="/web/register.html" data-i18n="mine.new">새 게임 등록</a></div>
      </div>
      <p class="rooms-lead" data-i18n="mine.lead"></p>
      <p id="mine-ai-next" class="rooms-lead" hidden></p>
      <ul id="mine-list" class="room-list"></ul>
      <p id="mine-empty" class="empty" hidden></p>
      <p id="mine-status" class="mine-status" role="status"></p>
    </section>

    <section id="matches" class="profile-block">
      <div class="list-head">
        <h2><span data-i18n="history.title">내 대국</span> <span id="count" class="count"></span></h2>
      </div>
      <p class="rooms-lead" data-i18n="history.lead"></p>
      <ul id="list" class="room-list"></ul>
      <p id="empty" class="empty" hidden></p>
    </section>

    <!-- 계정(계정만, GET /api/account): 이름 바꾸기와 탈퇴. 개발 서버에는 /api/account가 없어서 빠집니다 -->
    <section id="account" class="profile-block" hidden>
      <div class="list-head"><h2 data-i18n="account.title">계정</h2></div>
      <p id="account-info" class="rooms-lead"></p>

      <form id="rename" class="account-card">
        <label class="account-field">
          <span data-i18n="account.rename">이름 바꾸기</span>
          <span class="account-row">
            <input id="rename-name" type="text" autocomplete="nickname" autocapitalize="off" spellcheck="false" maxlength="8" required>
            <button id="rename-submit" class="btn" type="submit" data-i18n="account.rename.submit">바꾸기</button>
          </span>
        </label>
        <p id="rename-hint" class="account-hint"></p>
        <p id="rename-status" class="account-status" role="status"></p>
      </form>

      <details id="leave" class="account-card account-leave">
        <summary data-i18n="account.leave">탈퇴하기</summary>
        <p data-i18n="account.leave.lead"></p>
        <ul class="account-list">
          <li data-i18n="account.leave.matches"></li>
          <li data-i18n="account.leave.comments"></li>
          <li data-i18n="account.leave.games"></li>
          <li data-i18n="account.leave.again"></li>
        </ul>
        <form id="leave-form">
          <label class="account-field">
            <span id="leave-label"></span>
            <span class="account-row">
              <input id="leave-name" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
              <button id="leave-submit" class="btn danger" type="submit" data-i18n="account.leave.submit">탈퇴</button>
            </span>
          </label>
          <p id="leave-status" class="account-status" role="alert"></p>
        </form>
      </details>
    </section>

    <!-- 탈퇴한 뒤에는 이것만 보입니다 -->
    <section id="left" class="profile-block" hidden>
      <p data-i18n="account.left"></p>
      <a class="btn" href="/web/" data-i18n="signup.toLobby">게임 목록으로</a>
    </section>
  </main>

  <footer class="site-footer">
    <a href="/web/legal.html" data-i18n="footer.legal">약관과 개인정보</a>
    <a href="https://github.com/shin1244/boardmadang" data-i18n="footer.source">소스 코드</a>
    <a href="https://discord.gg/ayJzfmtXJ" data-i18n="footer.discord">디스코드</a>
    <a href="mailto:shincl1244@gmail.com" data-i18n="footer.contact">문의</a>
  </footer>

  <!-- AI 만들기 동의 창 (history.js의 agreeAI). "동의합니다"를 눌러야 요청을 보냅니다. 글자는 열 때 채웁니다 -->
  <dialog id="ai-ask" class="ask-dialog" aria-labelledby="ai-ask-title">
    <form method="dialog">
      <h2 id="ai-ask-title"></h2>
      <p id="ai-ask-lead"></p>
      <ul id="ai-ask-notes" class="ask-notes"></ul>
      <div class="ask-actions">
        <button id="ai-ask-cancel" class="btn ghost" value="cancel"></button>
        <button id="ai-ask-ok" class="btn" value="agree"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="history.js"></script>
</body>
</html>
