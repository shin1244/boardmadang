<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>운영 · 보드마당</title>
  <link rel="icon" href="icon-32.png" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="rooms.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="page">
  <!-- 글자는 web/i18n.js에 언어별로 있습니다. 여기 적힌 한국어는 스크립트가 돌기 전 잠깐 보이는 기본값입니다. -->
  <header class="topbar">
    <a class="logo" href="/web/">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span data-i18n="site.name">보드마당</span>
    </a>
    <nav class="menu" data-i18n-attr="aria-label:menu.label" aria-label="메뉴">
      <a href="/web/" data-i18n="menu.games">게임</a>
      <a href="/web/rooms.html" data-i18n="menu.rooms">방 목록</a>
      <span class="soon" data-i18n="menu.ranking" data-i18n-attr="title:soon" title="준비 중">랭킹</span>
      <a href="/web/register.html" data-i18n="menu.register">게임 등록</a>
      <a class="menu-admin" href="/web/admin.html" aria-current="page" hidden>운영</a>
    </nav>
    <div class="langs">
      <button class="lang-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="화면 언어: 한국어">KO</button>
    </div>
    <a class="me" href="/web/history.html" hidden></a>
    <button class="logout" type="button" data-i18n="logout" hidden>로그아웃</button>
    <div class="login-box">
      <button class="login" type="button" aria-haspopup="menu" aria-expanded="false" disabled data-i18n="login">로그인</button>
      <div class="login-menu" role="menu" hidden></div>
    </div>
  </header>

  <!-- 운영자 화면 (GET /api/admin, POST /api/admin/actions). 운영자(ADMIN_IDS)만 됩니다. 설계는 docs/moderation.md -->
  <main class="rooms admin">
    <h1 class="profile-name" data-i18n="admin.title">운영</h1>
    <p id="denied" class="empty" hidden></p>

    <div id="body" hidden>
      <!-- 통계 (GET /api/admin/stats). 그리는 것은 admin-stats.js -->
      <section id="stats" class="profile-block">
        <div class="list-head">
          <h2 data-i18n="stats.title">통계</h2>
          <div id="stat-range" class="stat-range" role="group" data-i18n-attr="aria-label:stats.range" aria-label="기간">
            <button type="button" data-days="7">7일</button>
            <button type="button" data-days="30" aria-pressed="true">30일</button>
            <button type="button" data-days="90">90일</button>
          </div>
        </div>
        <p class="rooms-lead" data-i18n="stats.lead"></p>
        <p id="stat-error" class="admin-status" role="alert" hidden></p>
        <div id="stat-body" hidden>
          <div id="stat-tiles" class="stat-tiles"></div>
          <div id="stat-charts" class="stat-charts"></div>
          <h3 id="stat-top-title" class="stat-h3"></h3>
          <div id="stat-top"></div>
          <details class="stat-details">
            <summary id="stat-table-label">표로 보기</summary>
            <div id="stat-table" class="stat-table-wrap"></div>
          </details>
        </div>
      </section>

      <section class="profile-block">
        <div class="list-head">
          <h2><span data-i18n="admin.queue">신고</span> <span id="queue-count" class="count"></span></h2>
          <div class="rooms-tools">
            <label class="admin-check"><input id="show-closed" type="checkbox"> <span data-i18n="admin.showClosed">처리한 신고도 보기</span></label>
            <button id="refresh" class="btn ghost" type="button" data-i18n="admin.refresh">새로고침</button>
          </div>
        </div>
        <p class="rooms-lead" data-i18n="admin.queue.lead"></p>
        <p id="status" class="admin-status" role="alert"></p>
        <ul id="targets" class="admin-list"></ul>
        <p id="queue-empty" class="empty" hidden></p>
      </section>

      <section class="profile-block">
        <div class="list-head">
          <h2><span data-i18n="admin.suspended">정지된 계정</span> <span id="suspended-count" class="count"></span></h2>
        </div>
        <ul id="suspended" class="room-list"></ul>
        <p id="suspended-empty" class="empty" hidden></p>
      </section>

      <!-- 제작자의 AI 만들기 요청 (GET /api/admin/ai/requests). 코드를 받으면 학습 중이 되고, 모델을 올리면 끝납니다 -->
      <section class="profile-block">
        <div class="list-head">
          <h2><span data-i18n="admin.asks">AI 요청</span> <span id="asks-count" class="count"></span></h2>
        </div>
        <p class="rooms-lead" data-i18n="admin.asks.lead"></p>
        <p id="asks-status" class="admin-status" role="alert"></p>
        <ul id="asks" class="admin-list"></ul>
        <p id="asks-empty" class="empty" hidden></p>
      </section>

      <!-- 브라우저 AI의 학습한 모델 (server/internal/ai). trainer/train.py --export-onnx가 만든 두 파일과 학습 기록을 올립니다 -->
      <section class="profile-block">
        <div class="list-head">
          <h2><span data-i18n="admin.ai">AI 모델</span> <span id="ai-count" class="count"></span></h2>
        </div>
        <p class="rooms-lead" data-i18n="admin.ai.lead"></p>
        <form id="ai-form" class="admin-ai-form">
          <label><span data-i18n="admin.ai.files">model.onnx, model.json, snapshots.json</span> <input id="ai-files" type="file" multiple accept=".onnx,.json"></label>
          <label><span data-i18n="admin.ai.game">게임</span> <select id="ai-game"></select></label>
          <button id="ai-upload" class="btn" type="submit" data-i18n="admin.ai.upload">올리기</button>
        </form>
        <p id="ai-status" class="admin-status" role="alert"></p>
        <ul id="ai-list" class="room-list"></ul>
        <p id="ai-empty" class="empty" hidden></p>
      </section>

      <section class="profile-block">
        <div class="list-head"><h2 data-i18n="admin.log">운영 기록</h2></div>
        <p class="rooms-lead" data-i18n="admin.log.lead"></p>
        <ol id="log" class="admin-log"></ol>
        <p id="log-empty" class="empty" hidden></p>
      </section>
    </div>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
