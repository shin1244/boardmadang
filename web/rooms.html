<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방 목록 · 보드마당</title>
  <meta name="description" content="규칙만 쓰면 보드 그리기, 온라인 대전, 기보는 보드마당이 맡습니다. 설치 없이 링크 하나로 바로 한 판.">
  <!-- 링크 미리보기(카톡, 디스코드 등). 미리보기 봇은 스크립트를 돌리지 않아서 HTML에 적고, 그림은 절대 주소로 둡니다 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="보드마당">
  <meta property="og:title" content="보드마당 · 방 목록">
  <meta property="og:description" content="규칙만 쓰면 보드 그리기, 온라인 대전, 기보는 보드마당이 맡습니다. 설치 없이 링크 하나로 바로 한 판.">
  <meta property="og:image" content="https://boardmadang.com/web/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icon-32.png" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="rooms.css">
</head>
<body class="page">
  <!-- 글자는 web/i18n.js에 언어별로 있습니다. 여기 적힌 한국어는 스크립트가 돌기 전 잠깐 보이는 기본값입니다. -->
  <header class="topbar">
    <a class="logo" href="/web/">
      <span class="logo-mark" aria-hidden="true"></span>
      <span data-i18n="site.name">보드마당</span>
    </a>
    <nav class="menu" data-i18n-attr="aria-label:menu.label" aria-label="메뉴">
      <a href="/web/" data-i18n="menu.games">게임</a>
      <a href="/web/rooms.html" aria-current="page" data-i18n="menu.rooms">방 목록</a>
      <span class="soon" data-i18n="menu.ranking" data-i18n-attr="title:soon" title="준비 중">랭킹</span>
      <a href="/web/register.html" data-i18n="menu.register">게임 등록</a>
    </nav>
    <div class="langs">
      <button class="lang-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="화면 언어: 한국어">KO</button>
    </div>
    <a class="me" href="/web/history.html" hidden></a>
    <button class="logout" type="button" data-i18n="logout" hidden>로그아웃</button>
    <div class="login-box">
      <button class="login" type="button" aria-haspopup="menu" aria-expanded="false" disabled data-i18n="login">로그인</button>
      <div class="login-menu" role="menu" hidden></div>
    </div>
  </header>

  <main class="rooms">
    <div class="list-head">
      <h1><span data-i18n="rooms.title">방 목록</span> <span id="count" class="count"></span></h1>
      <div class="rooms-tools">
        <label class="sort"><span data-i18n="rooms.game">게임</span>
          <select id="game-filter">
            <option value="" data-i18n="rooms.allGames">모든 게임</option>
          </select>
        </label>
        <button id="refresh" class="btn ghost" type="button" data-i18n="rooms.refresh">새로고침</button>
      </div>
    </div>
    <p class="rooms-lead" data-i18n="rooms.lead"></p>

    <ul id="list" class="room-list"></ul>
    <p id="empty" class="empty" hidden></p>

    <!-- 진행 중인 대국: 관전 -->
    <h2 class="live-title"><span data-i18n="rooms.live">진행 중인 대국</span> <span id="live-count" class="count"></span></h2>
    <ul id="live" class="room-list"></ul>
    <p id="live-empty" class="empty" hidden data-i18n="rooms.live.empty"></p>
  </main>

  <footer class="site-footer">
    <a href="/web/legal.html" data-i18n="footer.legal">약관과 개인정보</a>
    <a href="https://github.com/shin1244/boardmadang" data-i18n="footer.source">소스 코드</a>
    <a href="https://discord.gg/ayJzfmtXJ" data-i18n="footer.discord">디스코드</a>
    <a href="mailto:shincl1244@gmail.com" data-i18n="footer.contact">문의</a>
  </footer>

  <script type="module" src="rooms.js"></script>
</body>
</html>
